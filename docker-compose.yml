# OPTIONAL. Nothing in the project needs Docker: Qdrant runs embedded (QDRANT_URL empty) and
# Postgres is a hosted Neon database (DATABASE_URL). Use this file only if you prefer local servers:
# `docker compose up -d`, then set QDRANT_URL=http://localhost:6333 and
# DATABASE_URL=postgresql://mahsool:mahsool@localhost:5432/mahsool in .env.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mahsool
      POSTGRES_PASSWORD: mahsool
      POSTGRES_DB: mahsool
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahsool"]
      interval: 5s
      retries: 10
    restart: unless-stopped
