# Local services: `docker compose up -d`, then set QDRANT_URL=http://localhost:6333 in .env.
# The FastAPI backend joins this file in Milestone 3.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mahsool
      POSTGRES_PASSWORD: mahsool
      POSTGRES_DB: mahsool
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahsool"]
      interval: 5s
      retries: 10
    restart: unless-stopped
