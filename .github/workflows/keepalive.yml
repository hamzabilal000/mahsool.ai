name: Keep the API Space awake

# Free Hugging Face Spaces sleep after about 48 hours without traffic, and waking one takes minutes
# (models load on start). A ping twice a day keeps the demo responsive. Set the repository
# variable SPACE_URL (Settings > Secrets and variables > Actions > Variables), e.g.
# https://<user>-mahsool-api.hf.space; without it the job does nothing.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SPACE_URL != '' }}
    steps:
      - run: curl -fsS --max-time 120 "${{ vars.SPACE_URL }}/health"
