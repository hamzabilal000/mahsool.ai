[project]
name = "mahsool-ai"
version = "0.1.0"
description = "Cross-lingual RAG assistant for Pakistani tax law (FBR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# BGE-M3 embeddings and the reranker (pulls in PyTorch; weights download from Hugging Face)
ml = [
    "FlagEmbedding>=1.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "eval*", "backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # legal text uses en/em dashes and curly quotes on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
markers = [
    "pdf: needs the downloaded FBR PDF in data/raw (skipped otherwise)",
]
